<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fffefb" />
<title>Pamoka</title>
<style>
  :root {
    --paper: #f7f6f3; --card: #fffefb; --ink: #1a1815; --ink-2: #6b6560; --ink-3: #9c948c;
    --line: #e4e0d8; --line-2: #efece5; --green: #1f6b4a; --green-2: #14523a; --green-bg: #eef6f1;
    --gold: #8a6216; --gold-bg: #fbf5e6; --rust: #9c3521; --rust-bg: #fdf1ee;
    --r: 10px; --r-sm: 6px;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--paper); color: var(--ink); font-size: 15px; line-height: 1.45; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .hdr h1 { font-family: var(--serif); font-size: 21px; }
  .hdr span { font-size: 12.5px; color: var(--ink-3); }
  .logout { font-size: 12.5px; color: var(--ink-3); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 14px; }
  .lbl { font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
  .big { font-family: var(--serif); font-size: 24px; font-weight: 600; margin-top: 3px; }
  .sec-h { font-family: var(--serif); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 8px; }

  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
  .row:last-child { border-bottom: none; }
  .row-d { min-width: 74px; font-size: 13px; color: var(--ink-2); }
  .row-b { flex: 1; min-width: 0; }
  .row-t { font-size: 13.5px; font-weight: 500; }
  .row-s { font-size: 11.5px; color: var(--ink-3); }
  .chip { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
  .chip.paid { color: var(--green-2); background: var(--green-bg); border-color: #bcdcc9; }
  .chip.prepaid { color: var(--gold); background: var(--gold-bg); border-color: #ecdcb4; }
  .chip.unpaid { color: var(--rust); background: var(--rust-bg); border-color: #f0cabf; }
  .chip.due { color: var(--ink-3); background: #f6f4f0; border-color: var(--line); }

  textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: #fff; font-size: 14px; font-family: inherit; resize: vertical; min-height: 70px; }
  button.pri { margin-top: 8px; padding: 10px 16px; border-radius: var(--r-sm); border: 1px solid var(--green); background: var(--green); color: #fff; font-size: 13.5px; font-weight: 500; cursor: pointer; }
  button.pri:disabled { opacity: .55; cursor: default; }
  .note { font-size: 12px; color: var(--ink-3); margin: 0 0 10px; line-height: 1.4; }
  .empty { text-align: center; color: var(--ink-3); font-size: 13.5px; padding: 14px 0; }

  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 30px 26px; max-width: 320px; width: 100%; text-align: center; }
  .login-card h1 { font-family: var(--serif); font-size: 21px; margin-bottom: 4px; }
  .login-card p { font-size: 13px; color: var(--ink-2); margin: 0 0 18px; }
  .login-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); font-size: 14px; margin-bottom: 10px; font-family: inherit; }
  .login-card button { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--green); background: var(--green); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; }
  .msg { margin-top: 12px; font-size: 12.5px; color: var(--rust); }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="login" class="login-wrap">
    <div class="login-card">
      <h1>Pamoka</h1>
      <p>Sign in to see your lessons and payments.</p>
      <input id="u" placeholder="Username" autocomplete="username" />
      <input id="p" type="password" placeholder="Password" autocomplete="current-password" />
      <button onclick="doLogin()">Sign in</button>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <div id="app" class="wrap" hidden></div>

  <script src="/portal/portal.js"></script>
</body>
</html>
