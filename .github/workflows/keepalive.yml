name: Keep Render instance awake

# cron-job.org caps its request timeout at 30 seconds, which is shorter than
# Render's free-tier cold start (commonly 50-90s+), so every ping during a
# cold start was marked "failed" and the job kept getting auto-disabled.
# A GitHub Actions job has no such cap, so this replaces it.
on:
  schedule:
    # Every 10 minutes, roughly 8:00-22:00 Vilnius time. Cron below is in UTC
    # (5-19), which matches Vilnius summer time (UTC+3); it'll run about an
    # hour later than intended local time once winter time (UTC+2) starts.
    - cron: '*/10 5-19 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to keep it warm
        run: curl --fail --max-time 120 -u ":${{ secrets.APP_PASSWORD }}" https://mokiniai.onrender.com
